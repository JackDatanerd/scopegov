name: Vercel Sub-Hourly Crons

# FEATURE (cron audit, section 17): this workflow used to be the *only*
# way sow-stall, co-stall, and guardian-health ever ran — vercel.json only
# covered the 9 daily-or-slower jobs, since Vercel Cron on this plan can
# schedule sub-hourly too (see vercel.json). GitHub's own docs say
# `schedule`-triggered workflows can be delayed under platform load and
# are auto-disabled after 60 days with no repo activity — a real gap for
# a health check meant to run every 15 minutes, or a stall check central
# to this product's whole pitch. All 3 endpoints are now also registered
# directly in vercel.json as the reliable primary trigger; this workflow
# stays wired up purely as a redundant backup. Running both is safe:
# sow-stall/co-stall each guard their write with an optimistic-lock check
# (a double-fire just loses the race harmlessly on whichever invocation
# runs second), and guardian-health's ops alerts are now cooldown-guarded
# (see ops_alert_state, migration 025) so a double-fire there doesn't mean
# a double email either.

on:
  schedule:
    # sow-stall: hourly, on the hour
    - cron: '0 * * * *'
    # co-stall: hourly, offset 30 minutes
    - cron: '30 * * * *'
    # guardian-health: every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: {} # allows manual trigger from the Actions tab for testing

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Determine which endpoint(s) to call
        id: route
        run: |
          MIN=$(date -u +%M)
          HOUR_MARK=false
          HALF_HOUR_MARK=false
          QUARTER_MARK=false

          if [ "$MIN" = "00" ]; then HOUR_MARK=true; fi
          if [ "$MIN" = "30" ]; then HALF_HOUR_MARK=true; fi
          if [ "$MIN" = "00" ] || [ "$MIN" = "15" ] || [ "$MIN" = "30" ] || [ "$MIN" = "45" ]; then QUARTER_MARK=true; fi

          echo "hour_mark=$HOUR_MARK" >> "$GITHUB_OUTPUT"
          echo "half_hour_mark=$HALF_HOUR_MARK" >> "$GITHUB_OUTPUT"
          echo "quarter_mark=$QUARTER_MARK" >> "$GITHUB_OUTPUT"

      - name: Call sow-stall (hourly)
        if: steps.route.outputs.hour_mark == 'true'
        run: |
          curl -sS -o /dev/null -w "sow-stall: %{http_code}\n" --fail \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron/sow-stall"

      - name: Call co-stall (hourly, :30)
        if: steps.route.outputs.half_hour_mark == 'true'
        run: |
          curl -sS -o /dev/null -w "co-stall: %{http_code}\n" --fail \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron/co-stall"

      - name: Call guardian-health (every 15 min)
        if: steps.route.outputs.quarter_mark == 'true'
        run: |
          curl -sS -o /dev/null -w "guardian-health: %{http_code}\n" --fail \
            -X POST \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.APP_BASE_URL }}/api/cron/guardian-health"
