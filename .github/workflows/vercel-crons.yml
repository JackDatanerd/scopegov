name: Vercel Sub-Hourly Crons

# Redundant backup trigger for the frequent crons. The primary scheduler is now scopegov-cron-worker on
# Cloudflare (vercel.json no longer carries any crons).
#
# GitHub `schedule` runs are routinely delayed (minutes, sometimes far more at peak times) and are
# auto-disabled after 60 days without repository activity — so this is a backup, not the primary.
# Running both is safe: sow-stall / co-stall guard their writes with an optimistic status check (a
# double-fire just loses the race harmlessly), guardian-health's ops alerts are cooldown-guarded, and the
# heartbeat watchdog only reads.
#
# FIX (cron audit round 2): this used to decide WHICH endpoint to call from the wall-clock minute at the
# moment the job started (`date -u +%M` == "00"/"30"/...). A delayed run — the normal case, not the
# exception — started at e.g. :07 or :41, matched none of the checks, called nothing, and still finished
# green. It now routes on `github.event.schedule`, the cron expression that triggered the run, which is
# the same no matter how late the run actually starts.
#
# NOTE: any NEW cron route also has to be registered in the Cloudflare worker — nothing in this repo
# schedules it. cron-heartbeat-watchdog will flag one that never runs.

on:
  schedule:
    - cron: '0 * * * *'      # sow-stall (hourly)
    - cron: '30 * * * *'     # co-stall (hourly, offset)
    - cron: '*/15 * * * *'   # guardian-health (every 15 minutes)
    - cron: '45 * * * *'     # cron-heartbeat-watchdog (hourly) — redundant with the Cloudflare worker
  workflow_dispatch:
    inputs:
      target:
        description: 'Which cron to trigger manually'
        required: true
        default: 'sow-stall'
        type: choice
        options:
          - sow-stall
          - co-stall
          - guardian-health
          - cron-heartbeat-watchdog

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call the endpoint for this schedule
        env:
          SCHEDULE: ${{ github.event.schedule }}
          TARGET: ${{ github.event.inputs.target }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${TARGET:-}" ]; then
            NAME="$TARGET"
          else
            case "$SCHEDULE" in
              "0 * * * *")     NAME="sow-stall" ;;
              "30 * * * *")    NAME="co-stall" ;;
              "*/15 * * * *")  NAME="guardian-health" ;;
              "45 * * * *")    NAME="cron-heartbeat-watchdog" ;;
              *) echo "Unrecognised schedule '$SCHEDULE' — nothing to call"; exit 1 ;;
            esac
          fi
          # Two retries: a cold start or a transient 5xx should not cost a whole hour.
          curl -sS -o /dev/null -w "$NAME: %{http_code}\n" --fail --retry 2 --retry-delay 5 --retry-all-errors \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_BASE_URL}/api/cron/${NAME}"
